<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Phosphor-95: pixel-outline fonts render crisp (no antialiasing / hinting).
     Only these families are affected; every other font keeps system defaults. -->
<fontconfig>
  <match target="font">
    <test name="family"><string>W95FA</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family"><string>PxPlus IBM VGA 9x16</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family"><string>PxPlus IBM VGA 8x16</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family"><string>PxPlus IBM VGA 8x14</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family"><string>PxPlus IBM VGA 9x8</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
  <!-- No faux bold: these bitmap faces have no bold weight, and fontconfig's 90-synthetic
       smears them. Ask for regular instead so the synthetic rule never fires. -->
  <match target="pattern">
    <test name="family"><string>W95FA</string></test>
    <test name="weight" compare="more"><const>medium</const></test>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PxPlus IBM VGA 9x16</string></test>
    <test name="weight" compare="more"><const>medium</const></test>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PxPlus IBM VGA 8x16</string></test>
    <test name="weight" compare="more"><const>medium</const></test>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PxPlus IBM VGA 8x14</string></test>
    <test name="weight" compare="more"><const>medium</const></test>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PxPlus IBM VGA 9x8</string></test>
    <test name="weight" compare="more"><const>medium</const></test>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
</fontconfig>
